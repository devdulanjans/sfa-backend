spring:
  application:
    name: sfa-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sfadb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # This DB's flyway_schema_history has V89-V96 applied (an apparently abandoned
    # multi-tenancy branch) with no matching files anywhere in source control. Once
    # any local migration numbered beyond that gap exists (e.g. V97), Flyway stops
    # treating 89-96 as harmless "future" migrations and instead fails validation
    # with "Detected applied migration not resolved locally" for each of them.
    # This tells Flyway to tolerate migrations recorded as applied but missing from
    # disk, without altering flyway_schema_history (that's what `flyway repair`
    # would do, destructively) or requiring the original V89-96 files to be found.
    ignore-migration-patterns: "*:missing"

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000ms

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:changeme-use-a-long-secret-in-production-min-64-chars-required}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY:86400000}       # 24 hours (dev default; override via env var in prod)
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY:604800000}   # 7 days

  company:
    name: ${COMPANY_NAME:Iceman Cold Chain Services (Pvt) Ltd}
    tin: ${COMPANY_TIN:114372315-7000}
    reg-address: ${COMPANY_REG_ADDRESS:"No.43, St. Theresa's Road, Ragalla, Kandana"}
    operating-address: ${COMPANY_OP_ADDRESS:"No.60/2, Aniyakanda Estate, Aniyakanda, Nagoda, Kandana"}
    phone: ${COMPANY_PHONE:0112059224}
    email: ${COMPANY_EMAIL:sales@iceman.lk}
    bank:
      account-name: ${BANK_ACCOUNT_NAME:Iceman Cold Chain Services (Pvt) Ltd}
      account-number: ${BANK_ACCOUNT_NUMBER:1000973103}
      name: ${BANK_NAME:Commercial Bank of Ceylon PLC}
      branch: ${BANK_BRANCH:Kandana Branch}

  invoice:
    vat-rate: ${INVOICE_VAT_RATE:18}

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET:sfa-invoices}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

  platform-owner:
    bootstrap-password: ${PLATFORM_OWNER_PASSWORD:}

  recovery:
    key: ${RECOVERY_ACCESS_KEY:}

  # Google Routes API — used for the mobile app's live directions to a customer.
  # The key stays server-side; the app calls GET /api/routing/route. Blank = routing disabled
  # (the app then falls back to a straight-line direction).
  google-routes:
    api-key: ${GOOGLE_ROUTES_API_KEY:}
    travel-mode: ${GOOGLE_ROUTES_TRAVEL_MODE:DRIVE}          # DRIVE | TWO_WHEELER | WALK
    traffic-aware: ${GOOGLE_ROUTES_TRAFFIC_AWARE:false}      # true = live-traffic ETAs (higher-priced SKU)

  # Customer order/invoice notifications are set up per channel in Settings -> Notifications.
  # The mail / whatsapp blocks below are the optional SERVER DEFAULT account, used by any
  # channel that leaves its own SMTP host / WhatsApp phone-number id blank.
  notification:
    # Encrypts the per-channel SMTP passwords / WhatsApp tokens stored in the DB. Blank = derived
    # from JWT_SECRET. Changing it (or JWT_SECRET while blank) means re-entering those secrets.
    secret-key: ${NOTIFICATION_SECRET_KEY:}
  mail:
    # Server default SMTP server; blank = no default (channels must use their own).
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    starttls: ${SMTP_STARTTLS:true}                         # false for port 465 (SSL) or plain relays
    ssl: ${SMTP_SSL:false}                                  # true for port 465
    from: ${MAIL_FROM:}                                     # defaults to SMTP_USERNAME
    from-name: ${MAIL_FROM_NAME:}                           # defaults to the company name
  whatsapp:
    # Server default Meta WhatsApp Cloud API account; blank token or phone-number id = no default.
    # api-version and default-country-code apply to every channel.
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    api-version: ${WHATSAPP_API_VERSION:v21.0}
    template-name: ${WHATSAPP_TEMPLATE_NAME:sales_document_summary}
    template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:en}
    default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:94}  # prefixed to local numbers like 0771234567

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false

logging:
  level:
    com.sfa: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
